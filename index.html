<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Ping Pong</title>
<meta name="description" content="ブラウザで遊べるレトロなピンポンゲーム。CPU対戦（3段階）と2人対戦に対応。">
<link rel="icon" href="images/Icon-150x130.png">
<link rel="apple-touch-icon" href="images/Icon-150x130.png">
<link rel="author" type="text/plain" href="humans.txt">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05070d;color:#e8f0ff;
    font-family:"DotGothic16",system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh}
  #game{position:relative;width:min(100vw,150vh);width:min(100vw,150dvh);aspect-ratio:3/2;max-height:100dvh}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #game.playing canvas{cursor:none}

  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,7,13,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .overlay[hidden]{display:none}
  .panel{background:rgba(14,20,36,.94);border:2px solid #2a3a60;border-radius:16px;
    padding:clamp(14px,3vw,30px);width:min(92%,540px);max-height:94%;overflow:auto;text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.5)}
  h1{font-size:clamp(34px,7vw,64px);margin:0;letter-spacing:.08em;line-height:1.1;
    background:linear-gradient(90deg,#4fd1ff,#ff5fa2);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-size:clamp(26px,5vw,44px);margin:0 0 6px}
  .sub{opacity:.7;margin:4px 0 10px;font-size:clamp(13px,2vw,16px)}
  .group{margin:12px 0}
  .group[hidden]{display:none}
  .label{font-size:13px;opacity:.7;margin-bottom:6px}
  .seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  button{font-family:inherit;cursor:pointer}
  .seg button{background:#16203a;color:#cfe0ff;border:2px solid #2a3a60;border-radius:10px;
    padding:8px 14px;font-size:clamp(14px,2.2vw,17px);min-width:92px;transition:.15s}
  .seg button:hover{border-color:#4fd1ff}
  .seg button.on{background:#4fd1ff;color:#05070d;border-color:#4fd1ff}
  .btn{display:inline-block;border:none;border-radius:12px;padding:12px 26px;margin:6px;
    font-size:clamp(17px,2.8vw,22px);transition:.15s}
  .btn-primary{background:linear-gradient(90deg,#4fd1ff,#ff5fa2);color:#05070d;font-weight:bold}
  .btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn-sub{background:#16203a;color:#cfe0ff;border:2px solid #2a3a60}
  .btn-sub:hover{border-color:#4fd1ff}
  .record{font-size:14px;color:#ffd166;min-height:1.4em;margin:8px 0}
  .help{font-size:12.5px;opacity:.65;line-height:1.75;margin-top:10px}
  .score-big{font-size:clamp(30px,6vw,52px);letter-spacing:.1em;margin:4px 0}
  .score-big .l{color:#4fd1ff}.score-big .r{color:#ff5fa2}
  .info{font-size:15px;opacity:.85;line-height:1.7;margin-bottom:8px}
  .new{color:#ffd166}

  .hud{position:absolute;top:10px;right:10px;display:flex;gap:6px}
  .hud[hidden]{display:none}
  .hud button{width:42px;height:42px;border-radius:10px;background:rgba(22,32,58,.75);
    color:#cfe0ff;border:2px solid #2a3a60;font-size:18px;line-height:1;padding:0}
  .hud button:hover{border-color:#4fd1ff}
  .hud button.off{opacity:.45}
</style>
</head>
<body>
<div id="game">
  <canvas id="pong" width="1200" height="800" aria-label="ピンポンゲーム画面"></canvas>

  <div class="hud" id="hud" hidden>
    <button id="bgmBtn" title="BGMのオン・オフ（B）" aria-label="BGMのオン・オフ">🎵</button>
    <button id="muteBtn" title="効果音のオン・オフ（M）" aria-label="効果音のオン・オフ">🔊</button>
    <button id="pauseBtn" title="一時停止（Space）" aria-label="一時停止">⏸</button>
  </div>

  <!-- メニュー -->
  <div class="overlay" id="menu">
    <div class="panel">
      <h1>PING PONG</h1>
      <p class="sub">レトロ・ピンポン</p>

      <div class="group">
        <div class="label">モード</div>
        <div class="seg" data-key="mode">
          <button data-val="cpu">1人（CPU対戦）</button>
          <button data-val="pvp">2人対戦</button>
        </div>
      </div>

      <div class="group" id="diffGroup">
        <div class="label">むずかしさ</div>
        <div class="seg" data-key="diff">
          <button data-val="easy">かんたん</button>
          <button data-val="normal">ふつう</button>
          <button data-val="hard">むずかしい</button>
        </div>
      </div>

      <div class="group">
        <div class="label">勝利点（2点差がつくまでデュース）</div>
        <div class="seg" data-key="points">
          <button data-val="5">5点</button>
          <button data-val="11">11点</button>
        </div>
      </div>

      <div class="group">
        <div class="label">サウンド</div>
        <div class="seg">
          <button id="sfxToggle">効果音 ON</button>
          <button id="bgmToggle">BGM ON</button>
        </div>
      </div>

      <div class="record" id="record"></div>
      <button class="btn btn-primary" id="startBtn">スタート</button>
      <div class="help" id="help"></div>
    </div>
  </div>

  <!-- 一時停止 -->
  <div class="overlay" id="pauseMenu" hidden>
    <div class="panel">
      <h2>一時停止中</h2>
      <p class="sub">Space / P で再開</p>
      <button class="btn btn-primary" id="resumeBtn">再開</button>
      <button class="btn btn-sub" id="quitBtn">メニューへ</button>
    </div>
  </div>

  <!-- 結果 -->
  <div class="overlay" id="overMenu" hidden>
    <div class="panel">
      <h2 id="overTitle"></h2>
      <div class="score-big" id="overScore"></div>
      <div class="info" id="overInfo"></div>
      <button class="btn btn-primary" id="againBtn">もう一度</button>
      <button class="btn btn-sub" id="toMenuBtn">メニューへ</button>
    </div>
  </div>
</div>

<script src="js/app.js?v=20261121-3"></script>
</body>
</html>
